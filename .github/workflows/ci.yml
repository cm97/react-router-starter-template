name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx react-router typegen && npx tsc -b
      # Builds and validates the Worker. Needs no Cloudflare credentials.
      - name: Build and dry-run deploy
        run: npx react-router build && npx wrangler deploy --dry-run
